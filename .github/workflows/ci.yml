name: CI

on:
  push:
    branches:
      - main
      - "codex/**"
  pull_request:
    branches:
      - main

jobs:
  build:
    name: Build Rojo project
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Aftman
        uses: ok-nick/setup-aftman@v0.4.2

      - name: Install pinned tools
        run: aftman install --no-trust-check

      - name: Build place
        run: |
          mkdir -p build
          rojo build default.project.json -o build/project.rbxl
