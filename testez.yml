# TestEZ globals injected into *.spec modules (used by selene.toml).
---
base: roblox
name: testez
globals:
  describe:
    args:
      - type: string
      - type: function
  it:
    args:
      - type: string
      - type: function
  itFOCUS:
    args:
      - type: string
      - type: function
  itSKIP:
    args:
      - type: string
      - type: function
  FOCUS:
    args: []
  SKIP:
    args: []
  beforeAll:
    args:
      - type: function
  afterAll:
    args:
      - type: function
  beforeEach:
    args:
      - type: function
  afterEach:
    args:
      - type: function
  expect:
    args:
      - type: any
